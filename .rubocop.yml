AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'bin/**/*'
    - 'db/schema.rb'
    - 'vendor/**/*'
    - 'node_modules/**/*'
    - 'tmp/**/*'
    - 'log/**/*'
    - 'public/**/*'

Style/Documentation:
  Enabled: false

# CollectionsController#update, FriendsController#remove_friendship and
# UsersController#transfer_user_data unshare notes and collections between two
# users and are genuinely over these limits. They are untested business logic,
# so they are exempted rather than reworked blind; splitting them up is worth
# doing once there is coverage for the cascade they perform.

Metrics/MethodLength:
  Max: 30
  Exclude:
    - 'test/**/*'
    - 'app/controllers/users_controller.rb'

Metrics/AbcSize:
  Max: 40
  Exclude:
    - 'test/**/*'
    - 'app/controllers/friends_controller.rb'
    - 'app/controllers/users_controller.rb'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'app/controllers/collections_controller.rb'
    - 'app/controllers/friends_controller.rb'
    - 'app/controllers/users_controller.rb'

Metrics/PerceivedComplexity:
  Exclude:
    - 'app/controllers/collections_controller.rb'
    - 'app/controllers/friends_controller.rb'
    - 'app/controllers/users_controller.rb'

Metrics/ClassLength:
  Max: 200

# Reopening ActiveSupport::TestCase with compact style is what Rails generates.
Style/ClassAndModuleChildren:
  Exclude:
    - 'test/**/*'

Metrics/BlockLength:
  Exclude:
    - 'config/routes.rb'
    - 'db/seeds.rb'
    - 'test/**/*'

Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120
  Exclude:
    - 'test/**/*'
    - 'app/views/**/*'
